name: Daily TikTok Bot

on:
  schedule:
    - cron: '0 10 * * *' # يعمل تلقائياً كل يوم الساعة 10 صباحاً
  workflow_dispatch: # يتيح لك تشغيله يدوياً متى شئت من زر في جيت هب

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python bot.py
